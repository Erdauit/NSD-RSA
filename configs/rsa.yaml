# S3 — RSA configuration.

seed: 0

paths:
  betas: data/betas
  meta: data/meta
  stimuli: data/stimuli
  cache: cache
  figures: figures

stimuli:
  # Images with at least this many repeats in EVERY subject. 3 gives 515 images; see the
  # long note in configs/data.yaml for why unequal repeat counts are not acceptable here.
  min_repeats: 3
  subjects: [subj01, subj02, subj03, subj04, subj05, subj06, subj07, subj08]

rois:
  # Anatomical order: posterior/low-level first. The first three are the ventral
  # hierarchy the layer-depth claim is tested against; the rest are controls.
  order: [early, midventral, ventral, midlateral, lateral, midparietal, parietal]
  hierarchy: [early, midventral, ventral]

rdm:
  # 1 - Pearson across features. Chosen because it is invariant to per-stimulus gain and
  # offset: overall fMRI response amplitude drifts with arousal and attention, and we do
  # not want that drift entering the representational geometry.
  # Alternatives considered: euclidean keeps amplitude (bad here for the same reason);
  # crossnobis is better still but needs trial-level noise covariance, which is a larger
  # engineering step — recorded in docs/IDEAS.md.
  metric: correlation
  # Spearman between RDMs: we expect a monotonic model-brain relationship but have no
  # reason to assume linearity, and the two systems' distance scales differ wildly.
  compare: spearman

inference:
  n_permutations: 5000     # permutation test on the headline cell per (model, ROI)
  n_bootstrap: 1000        # bootstrap over images, for error bars
  alpha: 0.05

models:
  input_size: 224          # must match what S2 cached
  names: [dinov2_vitb14, dinov2_vitl14, vit_b16, clip_vitb16, resnet50]
