[project]
name = "nsd-rsa"
version = "0.1.0"
description = "Representational alignment between self-supervised vision transformers (DINOv2 et al.) and the human ventral visual stream (NSD, 7T fMRI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Erdauit" }]

dependencies = [
    # --- numerics ---
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    # --- neuroimaging I/O ---
    "nibabel>=5.2",
    "h5py>=3.10",
    # --- deep models ---
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.7",
    "open-clip-torch>=2.24",
    "pillow>=10.2",
    # --- data access ---
    "boto3>=1.34",
    "awscli>=1.32",
    "tqdm>=4.66",
    # --- config / plumbing ---
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "transformers>=5.15.0",
    "accelerate>=1.14.0",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsd_rsa"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # numpy's Accelerate (macOS arm64) BLAS backend emits spurious divide/overflow
    # RuntimeWarnings from plain matmul on finite inputs. Silencing only matmul keeps
    # genuine numerical warnings from our own code visible.
    "ignore:.*encountered in matmul:RuntimeWarning",
]

[tool.uv]
# torch on macOS arm64 comes from PyPI wheels; no extra index needed.
# On Windows/Linux PyPI ships CPU-only torch, so the GPU machine (RTX 5070 Ti, sm_120)
# pulls CUDA 13.0 wheels from the PyTorch index instead.
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "nbclient>=0.11.0",
]
